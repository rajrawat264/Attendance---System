<!DOCTYPE html>
<html>
<head>
<title>Attendance Management System</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to right, #667eea, #764ba2);
}

/* LOGIN */
#loginPage {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 12px;
  width: 350px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  margin: 5px;
  transition: 0.2s;
}

button:hover {
  opacity: 0.9;
  transform: scale(1.03);
}

.login { background: #007bff; }
.signup { background: #28a745; }

/* DASHBOARD */
#dashboard {
  display: none;
  background: #f4f6f9;
  min-height: 100vh;
}

/* FIXED HEADER */
.header {
  background: #007bff;
  color: white;
  padding: 15px 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logout {
  background: black;
  padding: 8px 15px;
  border-radius: 6px;
}

.container {
  padding: 20px;
}

.add { background: #28a745; }
.present { background: green; }
.absent { background: red; }
.delete { background: gray; }
.undo { background: orange; }
.percentBtn { background: purple; }

.search { background: #17a2b8; }
.reset { background: #6c757d; }

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border: 1px solid #ccc;
  text-align: center;
}

th {
  background: #007bff;
  color: white;
}

/* STATUS COLORS */
.status-present {
  background-color: #d4edda;
  color: #155724;
  font-weight: bold;
}

.status-absent {
  background-color: #f8d7da;
  color: #721c24;
  font-weight: bold;
}

/* SUMMARY */
.summary {
  margin-top: 20px;
  padding: 15px;
  background: white;
  border-radius: 10px;
  display: flex;
  justify-content: space-around;
  font-weight: bold;
}

.presentBox { color: green; }
.absentBox { color: red; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="card">
    <h2>Teacher Login</h2>
    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">
    <button class="signup" onclick="signUp()">Sign Up</button>
    <button class="login" onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="header">
    <h2 style="margin:0;">Attendance System</h2>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="container">

    <h3>Add Student</h3>

    <input type="text" id="roll" placeholder="Roll No">
    <input type="text" id="studentName" placeholder="Name">
    <input type="text" id="class" placeholder="Class">

    <button class="add" onclick="addStudent()">Add</button>
    <button class="undo" onclick="undoDelete()">Undo Delete</button>
    <button class="percentBtn" onclick="showMonthlyPercentage()">Show Monthly %</button>

    <br><br>

    <!-- SEARCH -->
    <input type="text" id="searchRoll" placeholder="Search by Roll No">
    <button class="search" onclick="searchStudent()">Search</button>
    <button class="reset" onclick="resetSearch()">Reset</button>

    <table id="table"></table>

    <!-- SUMMARY -->
    <div class="summary">
      <div>Total Students: <span id="total">0</span></div>
      <div class="presentBox">Present: <span id="present">0</span></div>
      <div class="absentBox">Absent: <span id="absent">0</span></div>
    </div>

  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB9WOvs0Ryr3TEpujroDzgb0xJTwESv_FU",
  authDomain: "attendance-management-sy-41cce.firebaseapp.com",
  projectId: "attendance-management-sy-41cce"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let students = [];
let deletedStudent = null;

// AUTO LOGIN
auth.onAuthStateChanged(user => {
  loginPage.style.display = user ? "none" : "flex";
  dashboard.style.display = user ? "block" : "none";
});

// AUTH
function signUp() {
  auth.createUserWithEmailAndPassword(email.value, password.value)
    .then(()=>alert("Signup Successful"))
    .catch(err=>alert(err.message));
}

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
    .then(()=>alert("Login Successful"))
    .catch(err=>alert(err.message));
}

function logout() {
  auth.signOut();
}

// ADD STUDENT (FIXED)
function addStudent() {
  let s = {
    roll: document.getElementById("roll").value,
    name: document.getElementById("studentName").value,
    cls: document.getElementById("class").value,
    attendance: {}
  };

  students.push(s);

  // clear fields
  document.getElementById("roll").value = "";
  document.getElementById("studentName").value = "";
  document.getElementById("class").value = "";

  display();
}

// DISPLAY
function display(list = students) {
  let table = document.getElementById("table");

  table.innerHTML = `
  <tr>
    <th>Date</th>
    <th>Roll No</th>
    <th>Name</th>
    <th>Class</th>
    <th>Status</th>
    <th>Action</th>
    <th>%</th>
  </tr>`;

  let today = new Date().toLocaleDateString("en-GB");

  let presentCount = 0;
  let absentCount = 0;

  list.forEach((s) => {
    let i = students.indexOf(s);
    let status = s.attendance[today] || "--";

    if (status === "Present") presentCount++;
    if (status === "Absent") absentCount++;

    let cls = status === "Present" ? "status-present" :
              status === "Absent" ? "status-absent" : "";

    table.innerHTML += `
    <tr>
      <td>${today}</td>
      <td>${s.roll}</td>
      <td>${s.name}</td>
      <td>${s.cls}</td>
      <td class="${cls}">${status}</td>
      <td>
        <button class="present" onclick="mark(${i},'Present')">P</button>
        <button class="absent" onclick="mark(${i},'Absent')">A</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
      <td>--</td>
    </tr>`;
  });

  document.getElementById("total").innerText = list.length;
  document.getElementById("present").innerText = presentCount;
  document.getElementById("absent").innerText = absentCount;
}

// MARK
function mark(i, s) {
  let today = new Date().toLocaleDateString("en-GB");
  students[i].attendance[today] = s;
  display();
}

// DELETE
function del(i) {
  deletedStudent = students[i];
  students.splice(i,1);
  display();
}

// UNDO
function undoDelete() {
  if(deletedStudent){
    students.push(deletedStudent);
    deletedStudent=null;
    display();
  }
}

// SEARCH
function searchStudent(){
  let val = searchRoll.value;
  display(students.filter(s=>s.roll.includes(val)));
}

function resetSearch(){
  searchRoll.value="";
  display();
}

</script>

</body>
</html>
