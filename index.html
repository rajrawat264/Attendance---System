<!DOCTYPE html>
<html>
<head>
<title>Attendance - Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial;
  background: linear-gradient(135deg, #1e293b, #1e3a8a, #312e81);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card {
  background: white;
  padding: 40px;
  border-radius: 14px;
  width: 360px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.card h2 { text-align:center; margin-bottom:6px; font-size:22px; color:#1e293b; }
.card p  { text-align:center; color:#94a3b8; font-size:13px; margin-bottom:24px; }
label { display:block; font-size:13px; font-weight:bold; color:#475569; margin-bottom:5px; margin-top:12px; }
input { width:100%; padding:11px 14px; border:1.5px solid #e2e8f0; border-radius:6px; font-size:14px; transition:border 0.2s; }
input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
.btn-row { display:flex; gap:10px; margin-top:20px; }
button { flex:1; padding:11px; border:none; border-radius:6px; font-size:14px; font-weight:bold; color:white; cursor:pointer; transition:0.2s; }
button:hover { opacity:0.88; transform:translateY(-1px); }
.btn-login  { background:#2563eb; }
.btn-signup { background:#16a34a; }
#msg { margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="card">
  <h2>Teacher Portal</h2>
  <p>Attendance Management System</p>
  <label>Email Address</label>
  <input type="email" id="email" placeholder="teacher@college.edu">
  <label>Password</label>
  <input type="password" id="password" placeholder="Password">
  <div class="btn-row">
    <button class="btn-signup" onclick="signUp()">Sign Up</button>
    <button class="btn-login"  onclick="login()">Login</button>
  </div>
  <div id="msg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script>
  auth.onAuthStateChanged(user => {
    if (user) window.location.href = "attendance.html";
  });
  function signUp() {
    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("password").value;
    if (!email || !pass) return showMsg("Please fill all fields.", "red");
    auth.createUserWithEmailAndPassword(email, pass)
      .then(() => { showMsg("Account created! Redirecting...", "green"); setTimeout(() => window.location.href = "attendance.html", 1000); })
      .catch(err => showMsg(err.message, "red"));
  }
  function login() {
    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("password").value;
    if (!email || !pass) return showMsg("Please fill all fields.", "red");
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => { showMsg("Login successful! Redirecting...", "green"); setTimeout(() => window.location.href = "attendance.html", 1000); })
      .catch(err => showMsg(err.message, "red"));
  }
  function showMsg(msg, color) {
    const el = document.getElementById("msg");
    el.textContent = msg;
    el.style.color = color;
  }
</script>
</body>
</html>
